<!-- User message -->
<div class="box">
  <h3>Your Query:</h3>
  <p>{{ query }}</p>
</div>

<!-- AI response -->
<div class="box">
  <h2>Washman AI's Recommendations:</h2>
  <p class="reply-text" id="reply"
    hx-ext="sse"
    sse-connect="/stream"
    sse-swap="message"
    sse-close="close"
    hx-swap="beforeend"></p>
</div>
